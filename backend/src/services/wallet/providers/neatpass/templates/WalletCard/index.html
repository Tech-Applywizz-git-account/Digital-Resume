<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=800">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --card-width: 800px;
            --card-height: 480px;
            --bg: #0F1419;
            --surface: #1A1F2E;
            --text-primary: #F1F5F9;
            --text-secondary: #8892A4;
            --text-muted: #5C6475;
            --accent: #5B8DEF;
            --accent-subtle: rgba(91, 141, 239, 0.12);
            --border-subtle: rgba(255, 255, 255, 0.06);
            --qr-border: rgba(255, 255, 255, 0.08);
            --qr-shadow: rgba(0, 0, 0, 0.3);
        }

        body {
            width: var(--card-width);
            height: var(--card-height);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: #0A0E14;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .card {
            width: var(--card-width);
            height: var(--card-height);
            background: var(--bg);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* Subtle top accent glow */
        .card::before {
            content: '';
            position: absolute;
            top: -120px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 300px;
            background: radial-gradient(ellipse, rgba(91, 141, 239, 0.06) 0%, transparent 70%);
            pointer-events: none;
        }

        /* ── Header ──────────────────────────────────── */
        .header {
            padding: 36px 44px 24px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            position: relative;
            z-index: 1;
        }

        .name {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.03em;
            line-height: 1.15;
            max-width: 520px;
            word-wrap: break-word;
        }

        .accent-line {
            width: 32px;
            height: 3px;
            background: var(--accent);
            border-radius: 2px;
            margin-top: 16px;
            flex-shrink: 0;
        }

        /* ── Body ────────────────────────────────────── */
        .body {
            flex: 1;
            padding: 0 44px 28px;
            display: flex;
            gap: 40px;
            position: relative;
            z-index: 1;
        }

        .body-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0;
            min-width: 0;
            justify-content: center;
        }

        /* ── Headline ────────────────────────────────── */
        .headline {
            font-size: 18px;
            font-weight: 500;
            color: var(--accent);
            letter-spacing: -0.01em;
            line-height: 1.3;
            word-wrap: break-word;
            margin-bottom: 2px;
        }

        .company {
            font-size: 13px;
            font-weight: 400;
            color: var(--text-secondary);
            margin-bottom: 18px;
            letter-spacing: 0.02em;
        }

        /* ── Divider ─────────────────────────────────── */
        .divider {
            width: 100%;
            height: 1px;
            background: var(--border-subtle);
            margin-bottom: 18px;
        }

        /* ── Contact ─────────────────────────────────── */
        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .contact-row {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .contact-icon {
            width: 20px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: var(--text-muted);
        }

        .contact-value {
            min-width: 0;
            word-wrap: break-word;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-secondary);
            font-weight: 400;
        }

        /* ── Profile URL ─────────────────────────────── */
        .profile-url {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .profile-url-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        .profile-url-value {
            font-size: 12px;
            color: var(--accent);
            word-wrap: break-word;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 450;
            opacity: 0.85;
        }

        /* ── QR Code ─────────────────────────────────── */
        .body-right {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 160px;
        }

        .qr-container {
            width: 140px;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            padding: 10px;
            background: var(--surface);
            border: 1px solid var(--qr-border);
            box-shadow: 0 4px 24px var(--qr-shadow);
        }

        .qr-container img {
            width: 100%;
            height: 100%;
            display: block;
        }

        .qr-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.3;
            max-width: 140px;
            letter-spacing: 0.04em;
        }

        /* ── Footer accent strip ─────────────────────── */
        .footer {
            height: 3px;
            background: linear-gradient(90deg, var(--accent) 0%, rgba(91, 141, 239, 0.3) 60%, transparent 100%);
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }
    </style>
</head>

<body>
    <div class="card">
        <!-- Header -->
        <div class="header">
            <div>
                <div class="name">{{fullName}}</div>
                <div class="accent-line"></div>
            </div>
        </div>

        <!-- Body -->
        <div class="body">
            <div class="body-left">
                <!-- Headline + Company -->
                <div class="headline">{{jobTitle}}</div>
                {{companyHtml}}

                <!-- Contact -->
                <div class="divider"></div>
                <div class="contact-list">{{contactHtml}}</div>

                <!-- Profile URL -->
                <div class="profile-url">
                    <span class="profile-url-label">Professional Profile</span>
                    <span class="profile-url-value">{{careerIdentityUrl}}</span>
                </div>
            </div>

            <!-- QR Code -->
            <div class="body-right">
                <div class="qr-container">
                    <img src="{{qrCodeDataUrl}}" alt="QR" />
                </div>
                <span class="qr-label">Scan to connect</span>
            </div>
        </div>

        <!-- Footer accent -->
        <div class="footer"></div>
    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=800">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0B4F6C;
            --primary-light: #159A9C;
            --dark: #1E293B;
            --white: #FFFFFF;
            --muted: #94A3B8;
            --light-bg: #F1F5F9;
            --accent: #0EA5E9;
            --border: #E2E8F0;
            --card-width: 800px;
            --card-height: 480px;
            --margin: 40px;
            --header-height: 160px;
        }

        body {
            width: var(--card-width);
            height: var(--card-height);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--light-bg);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            width: var(--card-width);
            height: var(--card-height);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* ── Header ── */
        .header {
            height: var(--header-height);
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            padding: 24px var(--margin);
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .header::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.08) 0%, transparent 70%);
            border-radius: 50%;
        }

        .header-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
            z-index: 1;
        }

        .header-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.8);
        }

        .header-name {
            font-size: 36px;
            font-weight: 800;
            color: var(--white);
            line-height: 1.1;
            max-width: 500px;
            word-wrap: break-word;
        }

        .header-brand {
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 0.05em;
            z-index: 1;
        }

        /* ── Body ── */
        .body {
            flex: 1;
            padding: 20px var(--margin) 16px;
            background: var(--white);
            display: flex;
            gap: 20px;
        }

        .body-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }

        .profile-row {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .profile-photo {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--border);
            flex-shrink: 0;
        }

        .profile-photo-placeholder {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--light-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 3px solid var(--border);
            color: var(--muted);
            font-size: 28px;
        }

        .title-section {
            min-width: 0;
        }

        .job-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--dark);
            line-height: 1.2;
            word-wrap: break-word;
        }

        .company {
            font-size: 14px;
            font-weight: 500;
            color: var(--primary-light);
            margin-top: 1px;
        }

        /* ── Divider ── */
        .divider {
            width: 100%;
            height: 1px;
            background: var(--border);
            margin: 4px 0;
        }

        /* ── Contact details ── */
        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--dark);
            line-height: 1.4;
        }

        .contact-icon {
            width: 18px;
            text-align: center;
            flex-shrink: 0;
            font-size: 13px;
        }

        .contact-text {
            min-width: 0;
            word-wrap: break-word;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .url-text {
            font-size: 11px;
            color: var(--primary);
            word-wrap: break-word;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ── QR Code ── */
        .body-right {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 6px;
            padding-top: 8px;
        }

        .qr-container {
            width: 110px;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 4px;
        }

        .qr-container img {
            width: 100%;
            height: 100%;
            display: block;
        }

        .qr-label {
            font-size: 9px;
            color: var(--muted);
            text-align: center;
            line-height: 1.3;
            max-width: 120px;
        }

        /* ── Footer ── */
        .footer {
            height: 36px;
            background: var(--light-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 var(--margin);
            border-top: 1px solid var(--border);
        }

        .footer-text {
            font-size: 10px;
            color: var(--muted);
            letter-spacing: 0.02em;
        }
    </style>
</head>

<body>
    <div class="card">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <span class="header-label">CAREER IDENTITY</span>
                <span class="header-name">{{fullName}}</span>
            </div>
            <span class="header-brand">ApplyWizz</span>
        </div>

        <!-- Body -->
        <div class="body">
            <div class="body-left">
                <div class="profile-row">
                    {{profileImageHtml}}
                    <div class="title-section">
                        <div class="job-title">{{jobTitle}}</div>
                        {{companyHtml}}
                    </div>
                </div>

                <div class="divider"></div>

                <div class="contact-list">
                    {{contactHtml}}
                </div>

                <div class="contact-item" style="margin-top: 2px;">
                    <span class="contact-icon">🔗</span>
                    <div>
                        <span class="contact-text" style="font-size:12px;font-weight:500;">Career Identity
                            Profile</span>
                        <div class="url-text">{{careerIdentityUrl}}</div>
                    </div>
                </div>
            </div>

            <div class="body-right">
                <div class="qr-container">
                    <img src="{{qrCodeDataUrl}}" alt="QR Code" />
                </div>
                <div class="qr-label">Scan to view Career Identity</div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <span class="footer-text">Powered by ApplyWizz — Import with NeatPass for Apple Wallet</span>
        </div>
    </div>
</body>

</html>
